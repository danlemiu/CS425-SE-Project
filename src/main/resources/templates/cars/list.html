<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cars List</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1 class="my-4">Cars List</h1>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="car : ${cars}">
            <div class="card">
                <img th:src="${car.imagePath}" class="card-img-top" alt="Car Image" onerror="this.src='default-image.jpg'">
                <div class="card-body">
                    <h5 class="card-title" th:text="${car.model.carModelName}">Model Name</h5>
                    <p class="card-text">
                        Dealer: <span th:text="${car.dealer.name}">Dealer Name</span><br/>
                        Status: <span th:text="${car.status}">Status</span>
                    </p>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/cars/{carId}(carId=${car.carId})}" class="btn btn-info btn-sm">View</a>
                        <a th:href="@{/cars/edit/{carId}(carId=${car.carId})}" class="btn btn-warning btn-sm">Edit</a>
                        <form th:action="@{/cars/{carId}(carId=${car.carId})}" method="delete" class="d-inline">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <a href="/cars/add" class="btn btn-primary">Add New Car</a>
</div>
</body>
</html>
